; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
default_envs = main_node
workspace_dir = .pio.nosync

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = 
	-D FW_VERSION=\"0.2.0\"
lib_deps = 
	sandeepmistry/LoRa@^0.8.0
	bblanchon/ArduinoJson@^7.2.0

[env:band_node]
platform = espressif32@^6.7.0
board = esp32dev
board_build.partitions = partitions/band_node.csv
build_src_filter = +<band_node/**>
build_flags = 
	${env.build_flags}
	-D DEVICE_TYPE_BAND_NODE=1
	-D ENABLE_OTA=0
lib_ignore = 
	ResQOTA
	WiFi
	WiFiClientSecure
	HTTPClient
	HTTPUpdate
	Update
	ArduinoJson
lib_deps =
	${env.lib_deps}
	adafruit/Adafruit MPU6050@^2.2.6
	sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

[env:resq_pin]
platform = espressif32@^6.7.0
board = esp32dev
board_build.partitions = partitions/resq_pin.csv
build_src_filter = +<resq_pin/**>
build_flags = 
	${env.build_flags}
	-D DEVICE_TYPE_RESQ_PIN=1
	-D ENABLE_OTA=0
lib_ignore = 
	ResQOTA
	WiFi
	WiFiClientSecure
	HTTPClient
	HTTPUpdate
	Update
	ArduinoJson

[env:resq_pin_0]
extends = env:resq_pin
build_flags = 
	${env:resq_pin.build_flags}
	-D PIN_INDEX=0

[env:resq_pin_1]
extends = env:resq_pin
build_flags = 
	${env:resq_pin.build_flags}
	-D PIN_INDEX=1

[env:resq_pin_2]
extends = env:resq_pin
build_flags = 
	${env:resq_pin.build_flags}
	-D PIN_INDEX=2

[env:resq_pin_3]
extends = env:resq_pin
build_flags = 
	${env:resq_pin.build_flags}
	-D PIN_INDEX=3

[env:resq_node]
platform = espressif32@^6.7.0
board = esp32dev
board_build.partitions = partitions/resq_node.csv
upload_speed = 115200
build_src_filter = +<resq_node/**>
build_flags = 
	${env.build_flags}
	-D DEVICE_TYPE_RESQ_NODE=1
lib_deps =
	${env.lib_deps}
	h2zero/NimBLE-Arduino@^1.4.1

[env:main_node]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
board_build.partitions = partitions/main_node.csv
build_src_filter = +<main_node/**>
build_flags = 
	${env.build_flags}
	-D DEVICE_TYPE_MAIN_NODE=1
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 921600
upload_flags = 
	--before=usb_reset
	--after=hard_reset
lib_deps = 
	${env.lib_deps}

[env:native]
platform = native
framework = 
build_flags = -I test/mock
test_build_src = false
lib_deps = 

[env:e2e_simulator]
platform = native
framework = 
build_flags = -I test/mock
test_build_src = false
lib_deps = 

[env:lora_sniffer]
platform = espressif32@^6.7.0
board = esp32dev
board_build.partitions = partitions/resq_pin.csv
build_src_filter = +<lora_sniffer/**>
build_flags = 
	${env.build_flags}
	-D DEVICE_TYPE_RESQ_PIN=1
	-D ENABLE_OTA=0
lib_ignore = 
	ResQOTA
	WiFi
	WiFiClientSecure
	HTTPClient
	HTTPUpdate
	Update
	ArduinoJson
