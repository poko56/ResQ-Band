[platformio]
src_dir = src
default_envs = main_node

; ---------- shared base ----------
[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -D FW_VERSION=\"0.2.0\"
; ArduinoJson is needed by the shared ResQOTA library; LoRa by every radio.
lib_deps =
  sandeepmistry/LoRa@^0.8.0
  bblanchon/ArduinoJson@^7.2.0

; ---------- Band-Node (worn wristband) ----------
; ESP32 DevKit V1 + MPU6050 (fall/tap) + MAX30102 (HR/SpO2) + LoRa + Buzzer
; Switched from C3 SuperMini to esp32dev for pin headroom (UWB room + matches
; Pillar/Handheld boards for shared spares).
[env:band_node]
platform = espressif32@^6.7.0
board = esp32dev
board_build.partitions = partitions/band_node.csv
build_src_filter = +<band_node/**>
build_flags =
  ${env.build_flags}
  -D DEVICE_TYPE_BAND_NODE=1
  -D ENABLE_OTA=0
lib_ignore =
  ResQOTA
  WiFi
  WiFiClientSecure
  HTTPClient
  HTTPUpdate
  Update
  ArduinoJson
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit MPU6050@^2.2.6
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

; ---------- ResQ-Pin (anchor tower, LoRa relay) ----------
; ESP32 DevKit + LoRa only. Reports RSSI of bands it hears each TDMA slot.
; PIN_INDEX selects this anchor's TDMA slot (3 + PIN_INDEX) and must be unique
; per physical tower. The four [env:resq_pin_N] variants below let you flash
; each tower with `pio run -e resq_pin_N -t upload` without editing files.
[env:resq_pin]
platform = espressif32@^6.7.0
board = esp32dev
board_build.partitions = partitions/resq_pin.csv
build_src_filter = +<resq_pin/**>
build_flags =
  ${env.build_flags}
  -D DEVICE_TYPE_RESQ_PIN=1
  -D ENABLE_OTA=0
; Skip OTA library so LDF doesn't drag in WiFi (saves ~600KB Flash too).
; Set ENABLE_OTA=1 + remove this lib_ignore line to enable OTA on Pillars.
lib_ignore =
  ResQOTA
  WiFi
  WiFiClientSecure
  HTTPClient
  HTTPUpdate
  Update
  ArduinoJson

; ---------- ResQ-Node (rescuer handheld) ----------
; ESP32 DevKit + LoRa + DW3000 UWB + OLED. Receives assignments, ranges UWB.
[env:resq_node]
platform = espressif32@^6.7.0
board = esp32dev
board_build.partitions = partitions/resq_node.csv
build_src_filter = +<resq_node/**>
build_flags =
  ${env.build_flags}
  -D DEVICE_TYPE_RESQ_NODE=1
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit SH110X@^2.1.11
  adafruit/Adafruit GFX Library@^1.11.10

; ---------- ResQ-MainNode (dispatch hub) ----------
; ESP32-S3 (native USB CDC for WebSerial). TDMA coordinator + triage + dispatch.
[env:main_node]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
board_build.partitions = partitions/main_node.csv
build_src_filter = +<main_node/**>
build_flags =
  ${env.build_flags}
  -D DEVICE_TYPE_MAIN_NODE=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
; Native USB CDC has no real DTR/RTS, so use usb_reset for auto-bootloader.
; First flash still needs manual BOOT button; subsequent ones may auto-reset.
upload_speed = 921600
upload_flags =
  --before=usb_reset
  --after=hard_reset
lib_deps =
  ${env.lib_deps}

; ---------- Native (Desktop Unit Tests) ----------
[env:native]
platform = native
framework = 
build_flags = -I test/mock
test_build_src = false
lib_deps = 

; ---------- E2E Simulator (Desktop) ----------
[env:e2e_simulator]
platform = native
framework = 
build_flags = -I test/mock
test_build_src = false
lib_deps = 

