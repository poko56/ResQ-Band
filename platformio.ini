; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
default_envs = main_node
workspace_dir = .pio.nosync

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = 
	-D FW_VERSION=\"0.2.0\"
lib_deps = 
	sandeepmistry/LoRa@^0.8.0
	bblanchon/ArduinoJson@^7.2.0

[env:band_node]
platform = espressif32@^6.7.0
board = esp32dev
board_build.partitions = partitions/band_node.csv
build_src_filter = +<band_node/**>
build_flags = 
	${env.build_flags}
	-D DEVICE_TYPE_BAND_NODE=1
	-D ENABLE_OTA=0
	; the wristband buzzer is a passive piezo: drive it with a tone
	-D BUZZER_PASSIVE=1
lib_ignore = 
	ResQOTA
	WiFi
	WiFiClientSecure
	HTTPClient
	HTTPUpdate
	Update
	ArduinoJson
lib_deps =
	${env.lib_deps}
	sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

[env:resq_pin]
platform = espressif32@^6.7.0
board = esp32dev
board_build.partitions = partitions/resq_pin.csv
build_src_filter = +<resq_pin/**>
build_flags = 
	${env.build_flags}
	-D DEVICE_TYPE_RESQ_PIN=1
	-D ENABLE_OTA=0
lib_ignore = 
	ResQOTA
	WiFi
	WiFiClientSecure
	HTTPClient
	HTTPUpdate
	Update
	ArduinoJson

# Pillars are counted 1..4 for humans (build target resq_pin_N = Pillar N).
# PIN_INDEX is the 0-based internal slot index (Pillar N -> PIN_INDEX N-1) used
# for the TDMA slot math and array positions. In practice each board also
# self-identifies from its MAC address in src/resq_pin/main.cpp, so PIN_INDEX
# is a fallback/label only.
[env:resq_pin_1]
extends = env:resq_pin
build_flags =
	${env:resq_pin.build_flags}
	-D PIN_INDEX=0

[env:resq_pin_2]
extends = env:resq_pin
build_flags =
	${env:resq_pin.build_flags}
	-D PIN_INDEX=1

[env:resq_pin_3]
extends = env:resq_pin
build_flags =
	${env:resq_pin.build_flags}
	-D PIN_INDEX=2

[env:resq_pin_4]
extends = env:resq_pin
build_flags =
	${env:resq_pin.build_flags}
	-D PIN_INDEX=3

[env:resq_node]
platform = espressif32@^6.7.0
board = esp32dev
board_build.partitions = partitions/resq_node.csv
upload_speed = 115200
build_src_filter = +<resq_node/**>
build_flags = 
	${env.build_flags}
	-D DEVICE_TYPE_RESQ_NODE=1
lib_deps =
	${env.lib_deps}

[env:main_node]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
board_build.partitions = partitions/main_node.csv
build_src_filter = +<main_node/**>
build_flags = 
	${env.build_flags}
	-D DEVICE_TYPE_MAIN_NODE=1
	; same passive piezo as the wristbands
	-D BUZZER_PASSIVE=1
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 921600
upload_flags = 
	--before=usb_reset
	--after=hard_reset
lib_deps = 
	${env.lib_deps}

[env:native]
platform = native
framework = 
build_flags = -I test/mock
test_build_src = false
lib_deps = 

[env:e2e_simulator]
platform = native
framework = 
build_flags = -I test/mock
test_build_src = false
lib_deps = 

[env:lora_sniffer]
platform = espressif32@^6.7.0
board = esp32dev
board_build.partitions = partitions/resq_pin.csv
build_src_filter = +<lora_sniffer/**>
build_flags = 
	${env.build_flags}
	-D DEVICE_TYPE_RESQ_PIN=1
	-D ENABLE_OTA=0
lib_ignore = 
	ResQOTA
	WiFi
	WiFiClientSecure
	HTTPClient
	HTTPUpdate
	Update
	ArduinoJson

[env:band_node_s3]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
board_build.partitions = partitions/band_node.csv
build_src_filter = +<band_node/**>
build_flags = 
	${env.build_flags}
	-D DEVICE_TYPE_BAND_NODE=1
	-D BAND_INDEX=1
	-D ENABLE_OTA=0
	-D BUZZER_PASSIVE=1
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_ignore = 
	ResQOTA
	WiFi
	WiFiClientSecure
	HTTPClient
	HTTPUpdate
	Update
	ArduinoJson
lib_deps =
	${env.lib_deps}
	sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

[env:band_node_2]
extends = env:band_node
build_flags = 
	${env:band_node.build_flags}
	-D BAND_INDEX=1

[env:i2c_scan]
platform = espressif32@^6.7.0
board = esp32dev
build_src_filter = +<i2c_scan/**>

; Standalone HR reader - NO LoRa/WiFi, just prove the MAX30102 reads a pulse.
[env:hr_read]
platform = espressif32@^6.7.0
board = esp32dev
build_src_filter = +<hr_read/**>
build_flags =
	${env.build_flags}
lib_ignore =
	LoRa
	WiFi
	WiFiClientSecure
	HTTPClient
	HTTPUpdate
	Update
	ArduinoJson
lib_deps =
	sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
