[platformio]
src_dir = src
default_envs = band_node

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:band_node]
platform = espressif32@^6.7.0
board = esp32-c3-devkitm-1
build_src_filter = +<band_node/**>
build_flags =
  -D BOARD_BAND_NODE
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  sandeepmistry/LoRa@^0.8.0
  adafruit/Adafruit MPU6050@^2.2.6
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

[env:main_node]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
build_src_filter = +<main_node/**>
build_flags =
  -D BOARD_MAIN_NODE
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 921600
upload_flags = --before=usb_reset --after=hard_reset
lib_deps =
  sandeepmistry/LoRa@^0.8.0

[env:pillar]
platform = espressif32@^6.7.0
board = esp32dev
build_src_filter = +<pillar/**>
build_flags = -D BOARD_PILLAR
lib_deps =
  sandeepmistry/LoRa@^0.8.0

[env:handheld]
platform = espressif32@^6.7.0
board = esp32dev
build_src_filter = +<handheld/**>
build_flags = -D BOARD_HANDHELD
lib_deps =
  sandeepmistry/LoRa@^0.8.0
  adafruit/Adafruit SH110X@^2.1.11
  adafruit/Adafruit GFX Library@^1.11.10
